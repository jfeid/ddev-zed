# ddev-zed: Zed editor integration for DDEV projects.
# Copies Zed config templates into .ddev/zed/, then installs them into .zed/.
# Also adds a `ddev zed` host command that opens the project in Zed.
# Files without '#ddev-generated' are treated as user-owned and never overwritten or removed.

name: zed

project_files:
  - zed/tasks.json
  - zed/debug.json
  - zed/settings.json
  - commands/host/zed

ddev_version_constraint: '>= v1.25.4'

# Run in the project's .ddev directory, on the host.
post_install_actions:
  - |
    #ddev-description:Install Zed tasks and debug config into .zed/
    mkdir -p "${DDEV_APPROOT}/.zed"
    files="tasks.json debug.json"
    if [ "${DDEV_ZED_MCP:-}" = "true" ]; then files="$files settings.json"; fi
    for f in $files; do
      src="${DDEV_APPROOT}/.ddev/zed/$f"
      dst="${DDEV_APPROOT}/.zed/$f"
      if [ -f "$dst" ] && ! grep -q '#ddev-generated' "$dst"; then
        echo "Skipped .zed/$f: it exists and is user-owned. Merge manually from .ddev/zed/$f"
        # Read-only hint: list template entries the user's file doesn't have yet.
        missing=""
        if [ "$f" = "settings.json" ]; then
          grep -q '"ddev-mcp"' "$dst" || missing='"ddev-mcp" context server'
        else
          while IFS= read -r label; do
            grep -qF "\"$label\"" "$dst" || missing="${missing:+$missing, }\"$label\""
          done < <(grep -o '"label": *"[^"]*"' "$src" | sed 's/^"label": *"//; s/"$//')
        fi
        if [ -n "$missing" ]; then
          echo "  Not found in your .zed/$f: $missing"
        fi
        continue
      fi
      cp "$src" "$dst"
      echo "Installed .zed/$f"
    done

# Files under .ddev/zed/ are removed automatically; these handle .zed/.
removal_actions:
  - |
    #ddev-description:Remove ddev-zed generated files from .zed/
    for f in tasks.json debug.json settings.json; do
      dst="${DDEV_APPROOT}/.zed/$f"
      if [ -f "$dst" ]; then
        if grep -q '#ddev-generated' "$dst"; then
          rm -f "$dst"
        else
          echo "Kept .zed/$f: user-owned (no #ddev-generated)"
        fi
      fi
    done
    rmdir "${DDEV_APPROOT}/.zed" 2>/dev/null || true
